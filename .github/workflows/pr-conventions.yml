name: PR conventions

# Required status check on main (job id `conventions`): do not rename it.
# Re-runs when the PR title or description is edited, not only on new commits.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate branch name, commits, PR title, and template
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-pr.mjs
